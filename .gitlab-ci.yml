include:
  - template: Jobs/SAST.gitlab-ci.yml

stages:
  - test
  - security
  - build

default:
  interruptible: true

variables:
  API_DIR: "src/data_service/api"
  INFLOW_GATEWAY_DIR: "src/data_service/inflow_gateway"
  TRANSFORM_LAYER_DIR: "src/data_service/transform_layer"
  DATABASE_DIR: "src/data_service/database"
  DATA_INITIALIZATION_DIR: "src/data_service/database/data_initialization"
  DATA_SERVICE_DIR: "src/data_service"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_BUILDKIT: "1"
  SAST_EXCLUDED_PATHS: "docs,venv,src/data_service/api/tests,src/data_service/inflow_gateway/tests,src/data_service/transform_layer/tests,src/data_service/tests"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .cache/pip

.data_service_branch_or_mr_changes: &data_service_branch_or_mr_changes
  - if: '$CI_PIPELINE_SOURCE == "push"'
    changes:
      - .gitlab-ci.yml
      - src/data_service/*
      - src/data_service/**/*
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes:
      - .gitlab-ci.yml
      - src/data_service/*
      - src/data_service/**/*
  - when: never

.data_service_push_changes: &data_service_push_changes
  - if: '$CI_PIPELINE_SOURCE == "push"'
    changes:
      - .gitlab-ci.yml
      - src/data_service/*
      - src/data_service/**/*
  - when: never

.python_test_template:
  image: python:3.11-slim
  stage: test
  rules: *data_service_branch_or_mr_changes

.docker_build_release_template:
  image: docker:24.0.5-cli
  stage: build
  rules: *data_service_push_changes
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - export LOCAL_IMAGE="${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - docker build --pull -f "$DOCKERFILE_PATH" -t "$LOCAL_IMAGE" "$BUILD_CONTEXT"
    - |
      if [ -n "${CI_REGISTRY:-}" ] && [ -n "${CI_REGISTRY_USER:-}" ] && [ -n "${CI_REGISTRY_PASSWORD:-}" ] && [ -n "${CI_REGISTRY_IMAGE:-}" ]; then
        export REMOTE_IMAGE="${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
        echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
        docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
        docker push "$REMOTE_IMAGE"
        if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
          export LATEST_IMAGE="${CI_REGISTRY_IMAGE}/${IMAGE_NAME}:latest"
          docker tag "$LOCAL_IMAGE" "$LATEST_IMAGE"
          docker push "$LATEST_IMAGE"
        fi
      else
        echo "GitLab container registry variables are unavailable, so the image was built but not pushed."
      fi

api_tests:
  extends: .python_test_template
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r "$API_DIR/requirements-dev.txt"
  script:
    - python -m pytest "$API_DIR/tests" --junitxml=api-junit.xml --cov="$API_DIR" --cov-report=term-missing
  artifacts:
    when: always
    reports:
      junit: api-junit.xml
    paths:
      - api-junit.xml

inflow_gateway_tests:
  extends: .python_test_template
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r "$INFLOW_GATEWAY_DIR/requirements.txt"
  script:
    - cd "$INFLOW_GATEWAY_DIR"
    - python -m pytest tests --junitxml="$CI_PROJECT_DIR/inflow-gateway-junit.xml"
  artifacts:
    when: always
    reports:
      junit: inflow-gateway-junit.xml
    paths:
      - inflow-gateway-junit.xml

transform_layer_tests:
  extends: .python_test_template
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install pytest==8.4.1 pytest-cov==7.0.0
  script:
    - export PYTHONPATH="$CI_PROJECT_DIR/$DATA_SERVICE_DIR${PYTHONPATH:+:$PYTHONPATH}"
    - python -m pytest "$TRANSFORM_LAYER_DIR/tests" --junitxml=transform-layer-junit.xml --cov="$TRANSFORM_LAYER_DIR" --cov-report=term-missing
  artifacts:
    when: always
    reports:
      junit: transform-layer-junit.xml
    paths:
      - transform-layer-junit.xml

api_build_release:
  extends: .docker_build_release_template
  needs:
    - api_tests
  variables:
    IMAGE_NAME: "data-service-api"
    DOCKERFILE_PATH: "$API_DIR/Dockerfile"
    BUILD_CONTEXT: "$DATA_SERVICE_DIR"

inflow_gateway_build_release:
  extends: .docker_build_release_template
  needs:
    - inflow_gateway_tests
  variables:
    IMAGE_NAME: "data-service-inflow-gateway"
    DOCKERFILE_PATH: "$INFLOW_GATEWAY_DIR/Dockerfile"
    BUILD_CONTEXT: "$DATA_SERVICE_DIR"

transform_layer_build_release:
  extends: .docker_build_release_template
  needs:
    - transform_layer_tests
  variables:
    IMAGE_NAME: "data-service-transform-layer"
    DOCKERFILE_PATH: "$TRANSFORM_LAYER_DIR/Dockerfile"
    BUILD_CONTEXT: "$DATA_SERVICE_DIR"

database_build_release:
  extends: .docker_build_release_template
  variables:
    IMAGE_NAME: "data-service-database"
    DOCKERFILE_PATH: "$DATABASE_DIR/Dockerfile"
    BUILD_CONTEXT: "$DATABASE_DIR"

data_initialization_build_release:
  extends: .docker_build_release_template
  variables:
    IMAGE_NAME: "data-service-data-initialization"
    DOCKERFILE_PATH: "$DATA_INITIALIZATION_DIR/Dockerfile"
    BUILD_CONTEXT: "$DATA_SERVICE_DIR"

security_analysis_owasp_zap:
  image: docker:24.0.5-cli
  stage: security
  rules: *data_service_branch_or_mr_changes
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    DAST_TARGET_OPENAPI_URL: "http://dast-target:8000/openapi.json"
  script:
    - mkdir -p zap-report
    - printf "{}\n" > zap-report/zap-report.json
    - printf "<html><body><h1>OWASP ZAP report was not generated.</h1></body></html>\n" > zap-report/zap-report.html
    - printf "# OWASP ZAP\nReport was not generated.\n" > zap-report/zap-report.md
    - export DAST_IMAGE="data-service-api-dast:${CI_COMMIT_SHORT_SHA}"
    - |
      if ! docker build --pull -f "$API_DIR/Dockerfile" -t "$DAST_IMAGE" "$DATA_SERVICE_DIR"; then
        echo "WARN: Failed to build DAST target image. Keeping placeholder reports."
        exit 0
      fi
    - |
      if ! docker network create dast-net; then
        echo "WARN: Failed to create DAST network. Keeping placeholder reports."
        exit 0
      fi
    - |
      if ! docker run -d --name dast-target --network dast-net "$DAST_IMAGE"; then
        echo "WARN: Failed to start DAST target container. Keeping placeholder reports."
        exit 0
      fi
    - |
      TARGET_READY=0
      for i in $(seq 1 30); do
        if docker run --rm --network dast-net curlimages/curl:8.8.0 -fsS "$DAST_TARGET_OPENAPI_URL" >/dev/null; then
          TARGET_READY=1
          echo "DAST target is ready."
          break
        fi
        sleep 2
      done
      if [ "$TARGET_READY" -ne 1 ]; then
        echo "WARN: DAST target did not become ready in time. Keeping placeholder reports."
        exit 0
      fi
    - |
      set +e
      docker run \
        --name zap-scanner \
        --network dast-net \
        ghcr.io/zaproxy/zaproxy:stable \
        zap-api-scan.py \
          -t "$DAST_TARGET_OPENAPI_URL" \
          -f openapi \
          -J /zap/wrk/zap-report.json \
          -r /zap/wrk/zap-report.html \
          -w /zap/wrk/zap-report.md
      ZAP_EXIT_CODE=$?
      set -e
      echo "OWASP ZAP exit code: $ZAP_EXIT_CODE"
      docker cp zap-scanner:/zap/wrk/zap-report.json zap-report/zap-report.json || true
      docker cp zap-scanner:/zap/wrk/zap-report.html zap-report/zap-report.html || true
      docker cp zap-scanner:/zap/wrk/zap-report.md zap-report/zap-report.md || true
      if [ "$ZAP_EXIT_CODE" -ne 0 ]; then
        echo "WARN: ZAP returned non-zero exit code; job will still pass."
      fi
      exit 0
  after_script:
    - docker logs dast-target || true
    - docker rm -f zap-scanner >/dev/null 2>&1 || true
    - docker rm -f dast-target >/dev/null 2>&1 || true
    - docker network rm dast-net >/dev/null 2>&1 || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - zap-report/zap-report.json
      - zap-report/zap-report.html
      - zap-report/zap-report.md
