window.C = {
  bg: "#0a0e14", surface: "#111820", border: "#1e2d3d",
  accent: "#00d084", accentD: "#00a866", amber: "#f5a623",
  red: "#ff4d6d", blue: "#6eb5ff", purple: "#b97cff",
  text: "#c9d8e8", muted: "#4a6070", white: "#e8f4ff"

window.Logo = ({ size = 16 }) => (
  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
    <svg width={size * 1.6} height={size * 1.6} viewBox="0 0 26 26">
      <rect x="1"  y="10" width="4" height="14" fill={window.C.accent} rx="1" />
      <rect x="7"  y="6"  width="4" height="18" fill={window.C.accent} opacity=".7" rx="1" />
      <rect x="13" y="2"  width="4" height="22" fill={window.C.accent} rx="1" />
      <rect x="19" y="8"  width="4" height="16" fill={window.C.accent} opacity=".5" rx="1" />
    </svg>
    <span style={{ fontFamily: "'JetBrains Mono'", fontWeight: 600, fontSize: size, color: window.C.white, letterSpacing: 1 }}>

window.Tag = ({ children, color }) => {
  const col = color || window.C.accent;
  return (
    <span style={{
      fontFamily: "'JetBrains Mono'", fontSize: 10, color: col,
      background: `${col}18`, border: `1px solid ${col}40`,
      borderRadius: 4, padding: "2px 8px", letterSpacing: 1
    }}>
      {children}
    </span>
  );
};

window.Input = ({ label, type = "text", placeholder, icon, ...props }) => (
  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
    <label style={{ fontSize: 12, color: window.C.muted, letterSpacing: 0.5, textTransform: "uppercase" }}>{label}</label>
    <div style={{ position: "relative" }}>
      {icon && (
        <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: window.C.muted, fontSize: 14 }}>
          {icon}
        </span>
      )}
      <input
        type={type}
        placeholder={placeholder}
        {...props}
        style={{
          width: "100%", background: window.C.bg, border: `1px solid ${window.C.border}`,
          borderRadius: 6, padding: icon ? "10px 12px 10px 36px" : "10px 12px",
          color: window.C.text, fontSize: 14, outline: "none", transition: "border-color .2s"
        }}
        onFocus={e => e.target.style.borderColor = window.C.accent}
        onBlur={e => e.target.style.borderColor = window.C.border}
      />
    </div>
  </div>
);

window.Btn = ({ children, variant = "primary", onClick, fullWidth, style, disabled, ...props }) => {
  const styles = {
    primary: { background: disabled ? window.C.muted : window.C.accent, color: "#000", fontWeight: 600 },
    ghost:   { background: "transparent", color: disabled ? window.C.muted : window.C.text, border: `1px solid ${window.C.border}` }
  };
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      {...props}
      style={{
        ...styles[variant],
        padding: "11px 22px", borderRadius: 6, fontSize: 14,
        cursor: disabled ? "not-allowed" : "pointer",
        width: fullWidth ? "100%" : "auto",
        border: styles[variant].border || "none",
        transition: "opacity .15s", fontFamily: "'DM Sans'",
        ...style
      }}
      onMouseEnter={e => !disabled && (e.currentTarget.style.opacity = ".85")}
      onMouseLeave={e => !disabled && (e.currentTarget.style.opacity = "1")}
    >
      {children}
    </button>
  );
};

window.candleData  = [38,42,40,55,50,62,58,70,65,72,68,75,71,80,77,85,82,78,84,88,83,91,87,94,90,96,92,88,95,97];
window.probHistory = [55,57,53,60,62,58,61,65,63,67,64,66,68,62,65,69,70,67,71,68,72,70,68,73,75,72,74,71,73,62];

  </script>
  <!-- Security logger (plain JS, no Babel needed) -->
  <script>
// ─── OBAnalyzer Frontend Logger ───────────────────────────────────────────────
// Sends security-relevant client events to POST /api/analytics/logs/client
// All entries follow the schema defined in log_design.md
// Server stamps the final datetime — client timestamp is advisory only.

const LOG_ENDPOINT = 'https://api.yourbackend.com/api/analytics/logs/client';

// Sanitise a string value to prevent log injection (CR, LF, delimiters)
const sanitize = (val) => {
  if (typeof val !== 'string') return val;
  return val.replace(/[\r\n\t|;]/g, '_').substring(0, 512);
};

// Build a base log entry — fields match the schema in log_design.md
const buildEntry = (event, level, description, extra = {}) => ({
  clientTime:  new Date().toISOString(),        // advisory only — server re-stamps
  appid:       'obanalyzer.frontend',
  level:       sanitize(level),
  event:       sanitize(event),
  userId:      sanitize(localStorage.getItem('ob_user_name') || 'anonymous'),
  userRole:    sanitize(localStorage.getItem('ob_user_role')  || 'unknown'),
  outcome:     sanitize(extra.outcome || 'unknown'),
  description: sanitize(description),
  ...Object.fromEntries(
    Object.entries(extra)
      .filter(([k]) => k !== 'outcome')
      .map(([k, v]) => [k, sanitize(String(v))])
  ),
});

// Fire-and-forget POST — logging failures must never break the application
const send = async (entry) => {
  try {
    await fetch(LOG_ENDPOINT, {
      method:  'POST',
      headers: {
        'Content-Type':  'application/json',
        'Authorization': `Bearer ${localStorage.getItem('jwt_token') || ''}`,
      },
      body: JSON.stringify(entry),
    });
  } catch (_) {
    // Silently swallow — logging failure must not surface to user or crash UI
  }
};

// ─── Public API ───────────────────────────────────────────────────────────────

window.Logger = {

  // Authentication
  loginAttempt:  (email) =>
    send(buildEntry('authn_login_attempt', 'INFO',
      'User initiated login', { endpoint: 'POST /v1/auth/login', outcome: 'attempt' })),

  loginSuccess:  () =>
    send(buildEntry('authn_login_success', 'INFO',
      'User authenticated successfully via MFA', { endpoint: 'POST /v1/auth/verify-mfa', outcome: 'success' })),

  loginFailure:  (reason) =>
    send(buildEntry('authn_login_failure', 'WARN',
      'Authentication failed: ' + (reason || 'unknown'), { endpoint: 'POST /v1/auth/verify-mfa', outcome: 'failure' })),

  logout: () =>
    send(buildEntry('authn_logout', 'INFO',
      'User signed out', { outcome: 'success' })),

  // Registration
  registerAttempt: () =>
    send(buildEntry('authn_register_attempt', 'INFO',
      'New account registration initiated', { endpoint: 'POST /v1/auth/register', outcome: 'attempt' })),

  registerSuccess: () =>
    send(buildEntry('authn_register_success', 'INFO',
      'Account registered and verified', { outcome: 'success' })),

  // Authorisation
  adminAccess: () =>
    send(buildEntry('authz_admin_access', 'INFO',
      'Admin panel accessed', { endpoint: 'admin.html', outcome: 'success' })),

  adminRedirect: () =>
    send(buildEntry('authz_redirect', 'WARN',
      'Non-admin user redirected from admin panel', { endpoint: 'admin.html', outcome: 'blocked' })),

  // Trading
  orderAttempt: (market, size) =>
    send(buildEntry('order_execute_attempt', 'INFO',
      'Order execution requested', { endpoint: 'POST /v1/orders/execute', market, size, outcome: 'attempt' })),

  orderSuccess: (market, size) =>
    send(buildEntry('order_execute_success', 'INFO',
      'Order executed successfully', { endpoint: 'POST /v1/orders/execute', market, size, outcome: 'success' })),

  orderFailure: (market, reason) =>
    send(buildEntry('order_execute_failure', 'WARN',
      'Order execution failed: ' + (reason || 'unknown'), { market, outcome: 'failure' })),

  // Billing
  subscribeAttempt: (plan, cycle) =>
    send(buildEntry('subscription_upgrade_attempt', 'INFO',
      'Subscription upgrade initiated', { plan, cycle, outcome: 'attempt' })),

  subscribeSuccess: (plan) =>
    send(buildEntry('subscription_upgrade_success', 'INFO',
      'Subscription upgraded', { plan, outcome: 'success' })),

  // Reports
  reportRequest: (template, format) =>
    send(buildEntry('report_generate_request', 'INFO',
      'Report generation requested', { template, format, outcome: 'attempt' })),

  // Client errors
  clientError: (message, source) =>
    send(buildEntry('client_error', 'ERROR',
      'Unhandled client error', { message: message || 'unknown', source: source || 'unknown', outcome: 'error' })),
};

// Global error handler — catches unhandled JS errors across all pages
window.onerror = (message, source, lineno) => {
  window.Logger.clientError(message, source + ':' + lineno);
  return false; // Don't suppress the error from the console
};

window.onunhandledrejection = (event) => {
  window.Logger.clientError('Unhandled promise rejection: ' + event.reason, 'promise');
};

  </script>

<body>
  <div id="app-root"></div>
  <script type="text/babel">
const { C, Logo, Btn, Tag } = window;
const { useState, useEffect, useMemo } = React;

const WalletScreen = () => {
  const [userName, setUserName]       = useState("Trader");
  const [activeMarket, setActiveMarket] = useState("BTC 15m UP");
  const [chartMode, setChartMode]     = useState('pnl');
  const [isLoading, setIsLoading]     = useState(true);
  const [lastUpdated, setLastUpdated] = useState(new Date().toLocaleTimeString());

  const [walletData, setWalletData] = useState({
    metrics:   { pnl: 0, winRate: 0, avgProfit: 0, efficiency: 0 },
    histories: { pnl: [], win: [], profit: [], eff: [] }
  });

  // GET /v1/wallet/overview — returns 4 core KPI metrics (bearerAuth required)
  // GET /v1/wallet/history  — returns array of historical events, params: ?market= &limit=
  //                           (bearerAuth required)
  //
  // Replace all FIELD_* placeholders below once backend confirms response field names.
  const fetchBackendData = async () => {
    try {
      const headers = { 'Authorization': `Bearer ${localStorage.getItem('jwt_token')}` };
      const [overviewRes, historyRes] = await Promise.all([
        fetch('https://api.yourbackend.com/v1/wallet/overview', { headers }),
        fetch(`https://api.yourbackend.com/v1/wallet/history?market=${encodeURIComponent(activeMarket)}&limit=100`, { headers })
      ]);
      if (!overviewRes.ok || !historyRes.ok) throw new Error('Fetch failed');

      const overview = await overviewRes.json();
      const history  = await historyRes.json();

      // FIELD MAPPING — confirm these field names with backend (/v1/wallet/overview response):
      //   FIELD_PNL        : total P&L value            (number)
      //   FIELD_WIN_RATE   : win rate percentage         (number, e.g. 68.2)
      //   FIELD_AVG_PROFIT : average profit per trade    (number)
      //   FIELD_EFFICIENCY : capital efficiency %        (number)
      //
      // FIELD MAPPING — confirm these field names with backend (/v1/wallet/history response):
      //   history is an array of historical events — confirm which keys hold:
      //   FIELD_SERIES_PNL    : cumulative P&L value per event
      //   FIELD_SERIES_WIN    : win rate value per event
      //   FIELD_SERIES_PROFIT : avg profit value per event
      //   FIELD_SERIES_EFF    : capital efficiency value per event

      setWalletData({
        metrics: {
          pnl:        parseFloat(overview.FIELD_PNL        ?? 0),
          winRate:    parseFloat(overview.FIELD_WIN_RATE   ?? 0),
          avgProfit:  parseFloat(overview.FIELD_AVG_PROFIT ?? 0),
          efficiency: parseFloat(overview.FIELD_EFFICIENCY ?? 0),
        },
        histories: {
          pnl:    history.map(e => parseFloat(e.FIELD_SERIES_PNL    ?? 0)),
          win:    history.map(e => parseFloat(e.FIELD_SERIES_WIN    ?? 0)),
          profit: history.map(e => parseFloat(e.FIELD_SERIES_PROFIT ?? 0)),
          eff:    history.map(e => parseFloat(e.FIELD_SERIES_EFF    ?? 0)),
        }
      });
      setIsLoading(false);
      setLastUpdated(new Date().toLocaleTimeString());
    } catch (err) {
      console.error('Failed to fetch wallet data:', err);
      // Fall back to mock data so the UI stays functional during development
      setWalletData({
        metrics:   { pnl: 142.50, winRate: 68.2, avgProfit: 24.10, efficiency: 91.5 },
        histories: {
          pnl:    [100, 105, 103, 110, 115, 112, 118, 125, 122, 142.5],
          win:    [60, 62, 58, 65, 66, 64, 68, 70, 67, 68.2],
          profit: [15, 18, 14, 20, 22, 19, 23, 25, 22, 24.1],
          eff:    [80, 82, 85, 88, 90, 89, 92, 94, 93, 91.5]
        }
      });
      setIsLoading(false);
      setLastUpdated(new Date().toLocaleTimeString());
    }
  };

  useEffect(() => {
    const savedName = localStorage.getItem('ob_user_name');
    if (savedName) setUserName(savedName);
  }, []);

  // Refetch on market switch
  useEffect(() => {
    setIsLoading(true);
    fetchBackendData();
  }, [activeMarket]);

  // Settlement simulation — advances all series forward with slight upward trend
  // Replace this interval with a WebSocket settlement listener in production
  useEffect(() => {
    if (isLoading) return;

    const advance = (arr, volatility, trend = 0) => {
      const last = arr[arr.length - 1];
      const next = Math.max(0, last + (Math.random() - 0.5 + trend) * volatility);
      return [...arr.slice(1), parseFloat(next.toFixed(2))];
    };

    const pollTimer = setInterval(() => {
      setWalletData(prev => {
        const newPnl    = advance(prev.histories.pnl,    8, 0.2);
        const newWin    = advance(prev.histories.win,    2);
        const newProfit = advance(prev.histories.profit, 1);
        const newEff    = advance(prev.histories.eff,    1);
        return {
          metrics: {
            pnl:        newPnl[newPnl.length - 1],
            winRate:    newWin[newWin.length - 1],
            avgProfit:  newProfit[newProfit.length - 1],
            efficiency: newEff[newEff.length - 1]
          },
          histories: { pnl: newPnl, win: newWin, profit: newProfit, eff: newEff }
        };
      });
      setLastUpdated(new Date().toLocaleTimeString());
    }, 5000);

    return () => clearInterval(pollTimer);
  }, [isLoading]);

  const config = useMemo(() => ({
    pnl:    { label: "Cumulative P&L",     color: C.accent,  unit: "$", suffix: "" },
    win:    { label: "Live Win Rate",       color: C.blue,    unit: "",  suffix: "%" },
    profit: { label: "Avg. Profit/Trade",  color: C.amber,   unit: "$", suffix: "" },
    eff:    { label: "Capital Efficiency", color: C.purple,  unit: "",  suffix: "%" }
  }[chartMode]), [chartMode]);

  const currentData = walletData.histories[chartMode] || [];

  if (isLoading) {
    return (
      <div style={{ height: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div style={{ textAlign: "center" }}>
          <div style={{ width: 40, height: 40, border: `3px solid ${C.accent}20`, borderTopColor: C.accent, borderRadius: "50%", animation: "spin 1s linear infinite", marginBottom: 16 }} />
          <div style={{ fontSize: 12, color: C.muted, letterSpacing: 2 }}>SYNCING WITH DATA NODE...</div>
        </div>
        <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
      </div>
    );
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", background: C.bg, color: C.white, fontFamily: "'DM Sans'" }}>

      <nav style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 24px", background: "rgba(18,18,18,0.8)", backdropFilter: "blur(10px)", borderBottom: `1px solid ${C.border}`, zIndex: 100 }}>
        <Logo size={14} />
        <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 10, color: C.muted }}>LAST SYNC</div>
            <div style={{ fontSize: 11, fontFamily: "'JetBrains Mono'", color: C.accent }}>{lastUpdated}</div>
          </div>
          <div style={{ width: 1, height: 24, background: C.border }} />
          <Btn variant="ghost" onClick={() => window.location.href = 'menu.html'}>Dashboard</Btn>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "4px 8px 4px 12px", background: `${C.accent}10`, borderRadius: 20, border: `1px solid ${C.accent}30` }}>
            <span style={{ fontSize: 12, fontWeight: 600 }}>{userName}</span>
            <div style={{ width: 24, height: 24, borderRadius: "50%", background: C.accent, color: C.bg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 800 }}>{userName[0]}</div>
          </div>
        </div>
      </nav>

      <main style={{ flex: 1, padding: "32px", maxWidth: 1400, margin: "0 auto", width: "100%" }}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 32 }}>
          <div>
            <h1 style={{ fontSize: 32, fontWeight: 700, margin: 0, letterSpacing: "-0.5px" }}>Wallet <span style={{ color: C.muted, fontWeight: 300 }}>Analytics</span></h1>
            <p style={{ color: C.muted, fontSize: 14, marginTop: 4 }}>Real-time performance monitoring for Duke FinTech Terminal</p>
          </div>
          <div style={{ display: "flex", gap: 8, background: C.surface, padding: 4, borderRadius: 10, border: `1px solid ${C.border}` }}>
            {["BTC 15m UP", "BTC 15m DN", "ETH 1H UP"].map(m => (
              <button key={m} onClick={() => setActiveMarket(m)} style={{ background: activeMarket === m ? C.bg : "transparent", color: activeMarket === m ? C.accent : C.muted, border: "none", borderRadius: 7, padding: "8px 16px", fontSize: 12, cursor: "pointer", fontWeight: 600, transition: "0.2s" }}>{m}</button>
            ))}
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 20, marginBottom: 32 }}>
          {[
            { id: 'pnl',    label: "Total P&L",   val: walletData.metrics.pnl,        unit: "$", color: C.accent, sub: "+14.2% yield" },
            { id: 'win',    label: "Win Rate",     val: walletData.metrics.winRate,    unit: "%", color: C.blue,   sub: "Above market avg" },
            { id: 'profit', label: "Avg Profit",   val: walletData.metrics.avgProfit,  unit: "$", color: C.amber,  sub: "Per winning trade" },
            { id: 'eff',    label: "Efficiency",   val: walletData.metrics.efficiency, unit: "%", color: C.purple, sub: "Capital utilization" }
          ].map(k => (
            <div
              key={k.id}
              onClick={() => setChartMode(k.id)}
              style={{ background: C.surface, border: `1px solid ${chartMode === k.id ? k.color : C.border}`, borderRadius: 16, padding: 24, cursor: "pointer", transition: "0.3s", boxShadow: chartMode === k.id ? `0 10px 30px -10px ${k.color}40` : 'none', transform: chartMode === k.id ? 'translateY(-4px)' : 'none' }}
            >
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 16 }}>
                <span style={{ fontSize: 11, color: C.muted, fontWeight: 700, letterSpacing: 1 }}>{k.label}</span>
                <div style={{ width: 6, height: 6, borderRadius: "50%", background: chartMode === k.id ? k.color : 'transparent' }} />
              </div>
              <div style={{ fontSize: 28, fontFamily: "'JetBrains Mono'", fontWeight: 700, color: k.color, marginBottom: 4, transition: "color 0.3s" }}>
                {k.unit === '$' ? `+${k.unit}${k.val.toFixed(2)}` : `${k.val.toFixed(1)}${k.unit}`}
              </div>
              <div style={{ fontSize: 12, color: C.muted }}>{k.sub}</div>
            </div>
          ))}
        </div>

        <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 20, padding: 32, position: "relative", overflow: "hidden" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 40 }}>
            <div>
              <div style={{ fontSize: 12, color: config.color, fontWeight: 700, letterSpacing: 1, textTransform: "uppercase", transition: "color 0.3s" }}>Live Streaming</div>
              <div style={{ fontSize: 20, fontWeight: 600, marginTop: 4 }}>{config.label} History</div>
            </div>
            <div style={{ display: "flex", gap: 12 }}>
              {['pnl', 'win', 'profit', 'eff'].map(mode => (
                <button
                  key={mode}
                  onClick={() => setChartMode(mode)}
                  style={{ background: chartMode === mode ? config.color : 'transparent', color: chartMode === mode ? C.bg : C.muted, border: chartMode === mode ? 'none' : `1px solid ${C.border}`, borderRadius: 8, padding: "6px 12px", fontSize: 11, fontWeight: 700, cursor: "pointer", transition: "0.3s" }}
                >
                  {mode.toUpperCase()}
                </button>
              ))}
            </div>
          </div>

          <div style={{ height: 350, width: "100%", position: "relative" }}>
            <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, display: "flex", flexDirection: "column", justifyContent: "space-between", color: C.muted, fontSize: 10, fontFamily: "'JetBrains Mono'", zIndex: 2 }}>
              <span>{config.unit}{Math.max(...currentData).toFixed(1)}{config.suffix}</span>
              <span style={{ opacity: 0.5 }}>{config.unit}{((Math.max(...currentData) + Math.min(...currentData)) / 2).toFixed(1)}{config.suffix}</span>
              <span>{config.unit}{Math.min(...currentData).toFixed(1)}{config.suffix}</span>
            </div>

            <svg width="100%" height="100%" preserveAspectRatio="none" viewBox="0 0 400 100" style={{ overflow: "visible" }}>
              <defs>
                <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%"   stopColor={config.color} stopOpacity="0.3" />
                  <stop offset="100%" stopColor={config.color} stopOpacity="0" />
                </linearGradient>
              </defs>
              <line x1="0" y1="10" x2="400" y2="10" stroke={C.border} strokeWidth="0.5" strokeDasharray="4" />
              <line x1="0" y1="50" x2="400" y2="50" stroke={C.border} strokeWidth="0.5" strokeDasharray="4" />
              <line x1="0" y1="90" x2="400" y2="90" stroke={C.border} strokeWidth="0.5" strokeDasharray="4" />
              {(() => {
                const min = Math.min(...currentData), max = Math.max(...currentData);
                const n   = v => 90 - ((v - min) / (max - min + 0.1)) * 80;
                const pts = currentData.map((v, i) => `${(i / (currentData.length - 1)) * 400},${n(v)}`).join(" ");
                return (
                  <>
                    <polygon points={`${pts} 400,100 0,100`} fill="url(#chartGrad)" style={{ transition: "all 0.6s ease" }} />
                    <polyline points={pts} fill="none" stroke={config.color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ transition: "all 0.6s ease" }} />
                    <circle cx="400" cy={n(currentData[currentData.length - 1])} r="4" fill={config.color} style={{ transition: "all 0.6s ease" }} />
                    <circle cx="400" cy={n(currentData[currentData.length - 1])} r="12" fill={config.color} fillOpacity="0.15" style={{ transition: "all 0.6s ease" }}>
                      <animate attributeName="r" values="8;16;8" dur="2s" repeatCount="indefinite" />
                    </circle>
                  </>
                );
              })()}
