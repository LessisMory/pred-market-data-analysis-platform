window.Btn = ({ children, variant = "primary", onClick, fullWidth, style, disabled, ...props }) => {

    ghost:   { background: "transparent", color: disabled ? window.C.muted : window.C.text, border: `1px solid ${window.C.border}` }

  return (

  <script>
// ─── OBAnalyzer Frontend Logger ───────────────────────────────────────────────
// Sends security-relevant client events to POST /api/analytics/logs/client
// All entries follow the schema defined in log_design.md
// Server stamps the final datetime — client timestamp is advisory only.

const LOG_ENDPOINT = 'https://api.yourbackend.com/api/analytics/logs/client';

// Sanitise a string value to prevent log injection (CR, LF, delimiters)
const sanitize = (val) => {
  if (typeof val !== 'string') return val;
  return val.replace(/[\r\n\t|;]/g, '_').substring(0, 512);
};

// Build a base log entry — fields match the schema in log_design.md
const buildEntry = (event, level, description, extra = {}) => ({
  clientTime:  new Date().toISOString(),        // advisory only — server re-stamps
  appid:       'obanalyzer.frontend',
  level:       sanitize(level),
  event:       sanitize(event),
  userId:      sanitize(localStorage.getItem('ob_user_name') || 'anonymous'),
  userRole:    sanitize(localStorage.getItem('ob_user_role')  || 'unknown'),
  outcome:     sanitize(extra.outcome || 'unknown'),
  description: sanitize(description),
  ...Object.fromEntries(
    Object.entries(extra)
      .filter(([k]) => k !== 'outcome')
      .map(([k, v]) => [k, sanitize(String(v))])
  ),
});

// Fire-and-forget POST — logging failures must never break the application
const send = async (entry) => {
  try {
    await fetch(LOG_ENDPOINT, {
      method:  'POST',
      headers: {
        'Content-Type':  'application/json',
        'Authorization': `Bearer ${localStorage.getItem('jwt_token') || ''}`,
      },
      body: JSON.stringify(entry),
    });
  } catch (_) {
    // Silently swallow — logging failure must not surface to user or crash UI
  }
};

// ─── Public API ───────────────────────────────────────────────────────────────

window.Logger = {

  // Authentication
  loginAttempt:  (email) =>
    send(buildEntry('authn_login_attempt', 'INFO',
      'User initiated login', { endpoint: 'POST /v1/auth/login', outcome: 'attempt' })),

  loginSuccess:  () =>
    send(buildEntry('authn_login_success', 'INFO',
      'User authenticated successfully via MFA', { endpoint: 'POST /v1/auth/verify-mfa', outcome: 'success' })),

  loginFailure:  (reason) =>
    send(buildEntry('authn_login_failure', 'WARN',
      'Authentication failed: ' + (reason || 'unknown'), { endpoint: 'POST /v1/auth/verify-mfa', outcome: 'failure' })),

  logout: () =>
    send(buildEntry('authn_logout', 'INFO',
      'User signed out', { outcome: 'success' })),

  // Registration
  registerAttempt: () =>
    send(buildEntry('authn_register_attempt', 'INFO',
      'New account registration initiated', { endpoint: 'POST /v1/auth/register', outcome: 'attempt' })),

  registerSuccess: () =>
    send(buildEntry('authn_register_success', 'INFO',
      'Account registered and verified', { outcome: 'success' })),

  // Authorisation
  adminAccess: () =>
    send(buildEntry('authz_admin_access', 'INFO',
      'Admin panel accessed', { endpoint: 'admin.html', outcome: 'success' })),

  adminRedirect: () =>
    send(buildEntry('authz_redirect', 'WARN',
      'Non-admin user redirected from admin panel', { endpoint: 'admin.html', outcome: 'blocked' })),

  // Trading
  orderAttempt: (market, size) =>
    send(buildEntry('order_execute_attempt', 'INFO',
      'Order execution requested', { endpoint: 'POST /v1/orders/execute', market, size, outcome: 'attempt' })),

  orderSuccess: (market, size) =>
    send(buildEntry('order_execute_success', 'INFO',
      'Order executed successfully', { endpoint: 'POST /v1/orders/execute', market, size, outcome: 'success' })),

  orderFailure: (market, reason) =>
    send(buildEntry('order_execute_failure', 'WARN',
      'Order execution failed: ' + (reason || 'unknown'), { market, outcome: 'failure' })),

  // Billing
  subscribeAttempt: (plan, cycle) =>
    send(buildEntry('subscription_upgrade_attempt', 'INFO',
      'Subscription upgrade initiated', { plan, cycle, outcome: 'attempt' })),

  subscribeSuccess: (plan) =>
    send(buildEntry('subscription_upgrade_success', 'INFO',
      'Subscription upgraded', { plan, outcome: 'success' })),

  // Reports
  reportRequest: (template, format) =>
    send(buildEntry('report_generate_request', 'INFO',
      'Report generation requested', { template, format, outcome: 'attempt' })),

  // Client errors
  clientError: (message, source) =>
    send(buildEntry('client_error', 'ERROR',
      'Unhandled client error', { message: message || 'unknown', source: source || 'unknown', outcome: 'error' })),
};

// Global error handler — catches unhandled JS errors across all pages
window.onerror = (message, source, lineno) => {
  window.Logger.clientError(message, source + ':' + lineno);
  return false; // Don't suppress the error from the console
};

window.onunhandledrejection = (event) => {
  window.Logger.clientError('Unhandled promise rejection: ' + event.reason, 'promise');
};

  </script>

  <div id="app-root"></div>
  <script type="text/babel">
const { C, Logo, Input, Btn } = window;
const { useState } = React;

const GoogleIcon = () => (
  <svg width="18" height="18" viewBox="0 0 24 24">
    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
  </svg>
);

const LoginScreen = () => {
  const [step, setStep]                   = useState('login');
  const [code, setCode]                   = useState(new Array(6).fill(""));
  const [emailValue, setEmailValue]       = useState("");
  const [passwordValue, setPasswordValue] = useState("");

  // Google OAuth — skip 2FA, go directly to menu
  // In production: window.location.href = 'https://api.yourbackend.com/v1/auth/google'
  const handleGoogleLogin = () => {
    window.Logger && window.Logger.loginAttempt();
    localStorage.setItem('ob_user_name', 'Trader');
    localStorage.setItem('ob_user_role', 'user');
    window.location.href = 'menu.html';
  };

  // POST /v1/auth/login — validate credentials, advance to 2FA on success
  const handleLoginSubmit = () => {
    let currentEmail = emailValue;
    const rawInput = document.querySelector('input[placeholder="trader@duke.edu"]');
    if (!currentEmail && rawInput) {
      currentEmail = rawInput.value;
      setEmailValue(currentEmail);
    }

    // try {
    //   const res = await fetch('https://api.yourbackend.com/v1/auth/login', {
    //     method: 'POST',
    //     headers: { 'Content-Type': 'application/json' },
    //     body: JSON.stringify({ email: currentEmail, password: passwordValue })
    //   });
    //   if (res.ok) { setStep('sms'); } else { alert("Invalid email or password"); }
    // } catch (err) { console.error(err); }

    window.Logger && window.Logger.loginAttempt();
    setStep('sms');
  };

  const handleCodeChange = (e, index) => {
    const value = e.target.value;
    if (isNaN(value)) return;
    const newCode = [...code];
    newCode[index] = value.substring(value.length - 1);
    setCode(newCode);
    if (value !== "" && index < 5) {
      document.getElementById(`login-sms-${index + 1}`)?.focus();
    }
  };

  // POST /v1/auth/verify-mfa — exchange 2FA code for JWT, persist token + role, redirect by role
  const handleMfaSubmit = async () => {
    const currentMail = (emailValue || "").toLowerCase().trim();
    const mfaCode = code.join("");

    // try {
    //   const res = await fetch('https://api.yourbackend.com/v1/auth/verify-mfa', {
    //     method: 'POST',
    //     headers: { 'Content-Type': 'application/json' },
    //     body: JSON.stringify({ email: currentMail, code: mfaCode })
    //   });
    //   const data = await res.json();
    //   if (data.token) {
    //     localStorage.setItem('jwt_token', data.token);
    //     localStorage.setItem('ob_user_name', data.user.firstName);
    //     localStorage.setItem('ob_user_role', data.user.role);
    //     window.location.href = data.user.role === 'admin' ? 'admin.html' : 'menu.html';
    //   } else { alert("Invalid verification code"); }
    // } catch (err) { console.error(err); }

    const userDB = JSON.parse(localStorage.getItem('ob_user_db') || '{}');
    let nameToSave = userDB[currentMail]
      || (currentMail.includes('@')
          ? currentMail.split('@')[0].replace(/^./, c => c.toUpperCase())
          : localStorage.getItem('ob_user_name') || "Jane");

    localStorage.setItem('ob_user_name', nameToSave);
    localStorage.setItem('ob_user_role', 'user');
    window.Logger && window.Logger.loginSuccess();
    window.location.href = 'menu.html';
  };

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", background: C.bg }}>
      <nav style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "18px 40px", borderBottom: `1px solid ${C.border}`, background: C.surface }}>
        <Logo size={15} />
        <Btn variant="ghost" onClick={() => window.location.href = 'index.html'}>← Return to Homepage</Btn>
      </nav>

      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: "40px", background: `radial-gradient(ellipse 50% 50% at 50% 50%, ${C.accent}08 0%, transparent 80%), ${C.bg}` }}>
        <div style={{ width: 380, background: C.surface, border: `1px solid ${C.border}`, borderRadius: 14, padding: "32px 30px", boxShadow: `0 20px 60px rgba(0,0,0,.4)`, minHeight: "480px", display: "flex", flexDirection: "column", justifyContent: "center" }}>

          <div style={{ textAlign: "center", marginBottom: 24 }}>
            <Logo size={18} />
          </div>

          {step === 'login' ? (
            <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
              <div style={{ textAlign: "center", marginBottom: 6 }}>
                <div style={{ fontSize: 20, fontWeight: 600, color: C.white }}>Terminal Sign In</div>
              </div>

              <button onClick={handleGoogleLogin} style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12, background: "#fff", color: "#3c4043", border: "1px solid #dadce0", borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                <GoogleIcon /> Continue with Google
              </button>

              <div style={{ display: "flex", alignItems: "center", gap: 10, margin: "2px 0" }}>
                <div style={{ flex: 1, height: 1, background: C.border }} />
                <span style={{ fontSize: 10, color: C.muted }}>OR EMAIL</span>
                <div style={{ flex: 1, height: 1, background: C.border }} />
              </div>

              <Input label="EMAIL" placeholder="trader@duke.edu" icon="✉" value={emailValue} onChange={e => setEmailValue(e.target.value)} />
              <Input label="PASSWORD" type="password" placeholder="••••••••" icon="🔒" value={passwordValue} onChange={e => setPasswordValue(e.target.value)} />

              <div style={{ marginTop: 4 }}>
                <Btn fullWidth onClick={handleLoginSubmit}>Sign In</Btn>
              </div>
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontSize: 32, marginBottom: 10 }}>💬</div>
                <div style={{ fontSize: 18, fontWeight: 600, color: C.white }}>Security Verification</div>
              </div>

              <div style={{ display: "flex", gap: 6, justifyContent: "center" }}>
                {code.map((digit, i) => (
                  <input
                    key={i} id={`login-sms-${i}`} type="text" maxLength="1" value={digit}
                    onChange={e => handleCodeChange(e, i)}
                    style={{ width: 40, height: 48, background: C.bg, border: `1px solid ${digit !== "" ? C.accent : C.border}`, borderRadius: 8, textAlign: "center", color: C.accent, outline: "none", fontSize: 20, fontWeight: "bold" }}
                  />
                ))}
              </div>

              <Btn fullWidth onClick={handleMfaSubmit}>Authenticate</Btn>

              <div style={{ textAlign: "center", marginTop: 4 }}>
                <span style={{ fontSize: 12, color: C.muted, cursor: "pointer" }} onClick={() => setStep('login')}>← Back to login</span>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('app-root')).render(<LoginScreen />);

  </script>
