    <div style={{ position: "relative" }}>

      <input
        type={type}
        placeholder={placeholder}
        {...props}
        style={{
          width: "100%", background: window.C.bg, border: `1px solid ${window.C.border}`,
          borderRadius: 6, padding: icon ? "10px 12px 10px 36px" : "10px 12px",

        }}
        onFocus={e => e.target.style.borderColor = window.C.accent}

      />

);

window.Btn = ({ children, variant = "primary", onClick, fullWidth, style, disabled, ...props }) => {
  const styles = {
    primary: { background: disabled ? window.C.muted : window.C.accent, color: "#000", fontWeight: 600 },
    ghost:   { background: "transparent", color: disabled ? window.C.muted : window.C.text, border: `1px solid ${window.C.border}` }
  };
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      {...props}
      style={{
        ...styles[variant],
        padding: "11px 22px", borderRadius: 6, fontSize: 14,
        cursor: disabled ? "not-allowed" : "pointer",
        width: fullWidth ? "100%" : "auto",
        border: styles[variant].border || "none",
        transition: "opacity .15s", fontFamily: "'DM Sans'",
        ...style

      onMouseEnter={e => !disabled && (e.currentTarget.style.opacity = ".85")}
      onMouseLeave={e => !disabled && (e.currentTarget.style.opacity = "1")}
    >
      {children}
    </button>
  );
};

window.candleData  = [38,42,40,55,50,62,58,70,65,72,68,75,71,80,77,85,82,78,84,88,83,91,87,94,90,96,92,88,95,97];
window.probHistory = [55,57,53,60,62,58,61,65,63,67,64,66,68,62,65,69,70,67,71,68,72,70,68,73,75,72,74,71,73,62];

  <!-- Security logger (plain JS, no Babel needed) -->
  <script>
// ─── OBAnalyzer Frontend Logger ───────────────────────────────────────────────
// Sends security-relevant client events to POST /api/analytics/logs/client
// All entries follow the schema defined in log_design.md
// Server stamps the final datetime — client timestamp is advisory only.

const LOG_ENDPOINT = 'https://api.yourbackend.com/api/analytics/logs/client';

// Sanitise a string value to prevent log injection (CR, LF, delimiters)
const sanitize = (val) => {
  if (typeof val !== 'string') return val;
  return val.replace(/[\r\n\t|;]/g, '_').substring(0, 512);
};

// Build a base log entry — fields match the schema in log_design.md
const buildEntry = (event, level, description, extra = {}) => ({
  clientTime:  new Date().toISOString(),        // advisory only — server re-stamps
  appid:       'obanalyzer.frontend',
  level:       sanitize(level),
  event:       sanitize(event),
  userId:      sanitize(localStorage.getItem('ob_user_name') || 'anonymous'),
  userRole:    sanitize(localStorage.getItem('ob_user_role')  || 'unknown'),
  outcome:     sanitize(extra.outcome || 'unknown'),
  description: sanitize(description),
  ...Object.fromEntries(
    Object.entries(extra)
      .filter(([k]) => k !== 'outcome')
      .map(([k, v]) => [k, sanitize(String(v))])
  ),
});

// Fire-and-forget POST — logging failures must never break the application
const send = async (entry) => {
  try {
    await fetch(LOG_ENDPOINT, {
      method:  'POST',
      headers: {
        'Content-Type':  'application/json',
        'Authorization': `Bearer ${localStorage.getItem('jwt_token') || ''}`,
      },
      body: JSON.stringify(entry),
    });
  } catch (_) {
    // Silently swallow — logging failure must not surface to user or crash UI
  }
};

// ─── Public API ───────────────────────────────────────────────────────────────

window.Logger = {

  // Authentication
  loginAttempt:  (email) =>
    send(buildEntry('authn_login_attempt', 'INFO',
      'User initiated login', { endpoint: 'POST /v1/auth/login', outcome: 'attempt' })),

  loginSuccess:  () =>
    send(buildEntry('authn_login_success', 'INFO',
      'User authenticated successfully via MFA', { endpoint: 'POST /v1/auth/verify-mfa', outcome: 'success' })),

  loginFailure:  (reason) =>
    send(buildEntry('authn_login_failure', 'WARN',
      'Authentication failed: ' + (reason || 'unknown'), { endpoint: 'POST /v1/auth/verify-mfa', outcome: 'failure' })),

  logout: () =>
    send(buildEntry('authn_logout', 'INFO',
      'User signed out', { outcome: 'success' })),

  // Registration
  registerAttempt: () =>
    send(buildEntry('authn_register_attempt', 'INFO',
      'New account registration initiated', { endpoint: 'POST /v1/auth/register', outcome: 'attempt' })),

  registerSuccess: () =>
    send(buildEntry('authn_register_success', 'INFO',
      'Account registered and verified', { outcome: 'success' })),

  // Authorisation
  adminAccess: () =>
    send(buildEntry('authz_admin_access', 'INFO',
      'Admin panel accessed', { endpoint: 'admin.html', outcome: 'success' })),

  adminRedirect: () =>
    send(buildEntry('authz_redirect', 'WARN',
      'Non-admin user redirected from admin panel', { endpoint: 'admin.html', outcome: 'blocked' })),

  // Trading
  orderAttempt: (market, size) =>
    send(buildEntry('order_execute_attempt', 'INFO',
      'Order execution requested', { endpoint: 'POST /v1/orders/execute', market, size, outcome: 'attempt' })),

  orderSuccess: (market, size) =>
    send(buildEntry('order_execute_success', 'INFO',
      'Order executed successfully', { endpoint: 'POST /v1/orders/execute', market, size, outcome: 'success' })),

  orderFailure: (market, reason) =>
    send(buildEntry('order_execute_failure', 'WARN',
      'Order execution failed: ' + (reason || 'unknown'), { market, outcome: 'failure' })),

  // Billing
  subscribeAttempt: (plan, cycle) =>
    send(buildEntry('subscription_upgrade_attempt', 'INFO',
      'Subscription upgrade initiated', { plan, cycle, outcome: 'attempt' })),

  subscribeSuccess: (plan) =>
    send(buildEntry('subscription_upgrade_success', 'INFO',
      'Subscription upgraded', { plan, outcome: 'success' })),

  // Reports
  reportRequest: (template, format) =>
    send(buildEntry('report_generate_request', 'INFO',
      'Report generation requested', { template, format, outcome: 'attempt' })),

  // Client errors
  clientError: (message, source) =>
    send(buildEntry('client_error', 'ERROR',
      'Unhandled client error', { message: message || 'unknown', source: source || 'unknown', outcome: 'error' })),
};

// Global error handler — catches unhandled JS errors across all pages
window.onerror = (message, source, lineno) => {
  window.Logger.clientError(message, source + ':' + lineno);
  return false; // Don't suppress the error from the console
};

window.onunhandledrejection = (event) => {
  window.Logger.clientError('Unhandled promise rejection: ' + event.reason, 'promise');
};

  </script>

<body>
  <div id="app-root"></div>
  <script type="text/babel">
const { C, Logo, Btn, Tag } = window;
const { useState, useEffect, useMemo } = React;

const HistoryScreen = () => {
  const [userName, setUserName]         = useState("Trader");
  const [filter, setFilter]             = useState("All");
  const [isLoading, setIsLoading]       = useState(true);
  const [transactions, setTransactions] = useState([]);

  useEffect(() => {
    const savedName = localStorage.getItem('ob_user_name');
    if (savedName) setUserName(savedName);
  }, []);

  // GET /v1/transactions — fetch billing & payment history for the authenticated user
  //
  // FIELD MAPPING — confirm these field names with backend:
  //   FIELD_ID          : unique trade identifier       → maps to txn.id
  //   FIELD_TIMESTAMP   : trade datetime string/epoch   → maps to txn.date
  //   FIELD_TYPE        : trade description / type      → maps to txn.desc
  //   FIELD_AMOUNT      : numeric amount                → maps to txn.amount
  //   FIELD_METHOD      : payment method string         → maps to txn.method
  //   FIELD_STATUS      : status string (e.g. "Paid")   → maps to txn.status
  //
  // Once confirmed, replace the FIELD_* placeholders below and remove this block.
  useEffect(() => {
    const fetchBackendTransactions = async () => {
      try {
        const res = await fetch('https://api.yourbackend.com/v1/transactions', {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('jwt_token')}` }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const raw = await res.json();

        // Normalise raw records into the shape this component expects.
        // Replace every FIELD_* with the actual key name from the API response.
        const normalised = raw.map(item => ({
          id:     item.FIELD_ID,
          date:   new Date(item.FIELD_TIMESTAMP).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }),
          desc:   item.FIELD_TYPE,
          amount: `$${parseFloat(item.FIELD_AMOUNT).toFixed(2)}`,
          method: item.FIELD_METHOD ?? '—',
          status: item.FIELD_STATUS,
        }));

        setTransactions(normalised);
        setIsLoading(false);
      } catch (err) {
        console.error('Failed to fetch trades:', err);
        setIsLoading(false);
      }
    };

    fetchBackendTransactions();
  }, []);

  // WS /stream — optional: listen for newly settled trade events pushed by backend
  // ws.onmessage = (event) => {
  //   const item = JSON.parse(event.data);
  //   const newTxn = {
  //     id:     item.FIELD_ID,
  //     date:   new Date(item.FIELD_TIMESTAMP).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' }),
  //     desc:   item.FIELD_TYPE,
  //     amount: `$${parseFloat(item.FIELD_AMOUNT).toFixed(2)}`,
  //     method: item.FIELD_METHOD ?? '—',
  //     status: item.FIELD_STATUS,
  //   };
  //   setTransactions(prev => [newTxn, ...prev]);
  // };

  const filteredTransactions = filter === "All"
    ? transactions
    : transactions.filter(t => t.status === filter);

  // Memoized to avoid recalculating on every render
  const totalBilled = useMemo(() =>
    transactions
      .filter(t => t.status === 'Paid')
      .reduce((sum, t) => sum + parseFloat(t.amount.replace('$', '')), 0),
    [transactions]
  );

  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", background: C.bg, color: C.white, fontFamily: "'DM Sans'" }}>

      <nav style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "12px 24px", background: "rgba(18,18,18,0.8)", backdropFilter: "blur(10px)", borderBottom: `1px solid ${C.border}`, zIndex: 100 }}>
        <Logo size={14} />
        <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
          <Btn variant="ghost" onClick={() => window.location.href = 'menu.html'}>← Menu</Btn>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "4px 12px", background: `${C.accent}10`, borderRadius: 20, border: `1px solid ${C.accent}30` }}>
            <span style={{ fontSize: 12, fontWeight: 600 }}>{userName}</span>
            <div style={{ width: 24, height: 24, borderRadius: "50%", background: C.accent, color: C.bg, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 800 }}>{userName[0]}</div>
          </div>
        </div>
      </nav>

      <main style={{ flex: 1, padding: "32px", maxWidth: 1200, margin: "0 auto", width: "100%" }}>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 32 }}>
          <div>
            <h1 style={{ fontSize: 28, fontWeight: 700, margin: 0, letterSpacing: "-0.5px" }}>Transaction History</h1>
            <p style={{ color: C.muted, fontSize: 14, marginTop: 4 }}>All billing activity for your account.</p>
          </div>
          <div style={{ textAlign: "right" }}>
            <div style={{ fontSize: 11, color: C.muted, textTransform: "uppercase", letterSpacing: 1, marginBottom: 4 }}>CURRENT PLAN</div>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <Tag color={C.accent}>Pro</Tag>
              <span style={{ fontSize: 13, color: C.white }}>Active since 2025</span>
              <Btn variant="ghost" style={{ padding: "6px 12px", fontSize: 12, border: `1px solid ${C.border}` }}>Manage Plan</Btn>
            </div>
          </div>
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 20, marginBottom: 32 }}>
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 16, padding: 24 }}>
            <div style={{ fontSize: 11, color: C.muted, fontWeight: 700, letterSpacing: 1, marginBottom: 8 }}>TOTAL BILLED</div>
            <div style={{ fontSize: 28, fontFamily: "'JetBrains Mono'", fontWeight: 700, color: C.white }}>${totalBilled.toFixed(2)}</div>
            <div style={{ fontSize: 12, color: C.muted, marginTop: 4 }}>Lifetime spend</div>
          </div>
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 16, padding: 24 }}>
            <div style={{ fontSize: 11, color: C.muted, fontWeight: 700, letterSpacing: 1, marginBottom: 8 }}>TRANSACTIONS</div>
            <div style={{ fontSize: 28, fontFamily: "'JetBrains Mono'", fontWeight: 700, color: C.blue }}>{transactions.length}</div>
            <div style={{ fontSize: 12, color: C.muted, marginTop: 4 }}>Records logged</div>
          </div>
          <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 16, padding: 24 }}>
            <div style={{ fontSize: 11, color: C.muted, fontWeight: 700, letterSpacing: 1, marginBottom: 8 }}>NEXT RENEWAL</div>
            <div style={{ fontSize: 28, fontFamily: "'JetBrains Mono'", fontWeight: 700, color: C.amber }}>Apr 01, 2026</div>
            <div style={{ fontSize: 12, color: C.muted, marginTop: 4 }}>$29.00 / month</div>
          </div>
        </div>

        <div style={{ background: C.surface, border: `1px solid ${C.border}`, borderRadius: 20, overflow: "hidden", minHeight: 400 }}>

          <div style={{ display: "flex", alignItems: "center", padding: "20px 24px", borderBottom: `1px solid ${C.border}` }}>
            <h3 style={{ fontSize: 16, fontWeight: 600, margin: 0, marginRight: "auto" }}>Invoices & Payments</h3>
            <div style={{ display: "flex", gap: 8, background: C.bg, padding: 4, borderRadius: 8, border: `1px solid ${C.border}` }}>
              {["All", "Paid", "Refunded"].map(status => (
                <button
                  key={status}
                  onClick={() => setFilter(status)}
                  style={{ background: filter === status ? C.surface : "transparent", color: filter === status ? C.white : C.muted, border: "none", borderRadius: 6, padding: "6px 14px", fontSize: 12, cursor: "pointer", fontWeight: 600, transition: "0.2s" }}
                >
                  {status}
                </button>
              ))}
            </div>
            <Btn variant="ghost" style={{ marginLeft: 16, padding: "6px 12px", fontSize: 12, border: `1px solid ${C.border}` }}>↓ Download CSV</Btn>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 2fr 1fr 1fr 1fr", padding: "16px 24px", background: `${C.bg}80`, borderBottom: `1px solid ${C.border}`, fontSize: 11, color: C.muted, fontWeight: 700, letterSpacing: 1 }}>
            <div>TRANSACTION ID</div>
            <div>DATE</div>
            <div>DESCRIPTION</div>
            <div>AMOUNT</div>
            <div>PAYMENT METHOD</div>
            <div style={{ textAlign: "right" }}>STATUS</div>
          </div>

          {isLoading ? (
            <div style={{ padding: "60px 24px", textAlign: "center", color: C.muted }}>
              <div style={{ width: 30, height: 30, border: `2px solid ${C.accent}40`, borderTopColor: C.accent, borderRadius: "50%", animation: "spin 1s linear infinite", margin: "0 auto 16px" }} />
              <div>Fetching transaction history from database...</div>
              <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
            </div>
          ) : (
            <div style={{ display: "flex", flexDirection: "column" }}>
              <style>{`
                @keyframes highlightRow {
                  0%   { background-color: ${C.accent}40; }
                  100% { background-color: transparent; }
                }
              `}</style>
              {filteredTransactions.map((txn, idx) => (
                <div
                  key={txn.id}
                  style={{ display: "grid", gridTemplateColumns: "1fr 1fr 2fr 1fr 1fr 1fr", padding: "20px 24px", borderBottom: idx === filteredTransactions.length - 1 ? "none" : `1px solid ${C.border}50`, alignItems: "center", transition: "background 0.2s", cursor: "pointer", animation: txn.id === 'TXN-00143' ? 'highlightRow 2s ease-out' : 'none' }}
                  onMouseEnter={e => e.currentTarget.style.background = `${C.bg}40`}
                  onMouseLeave={e => e.currentTarget.style.background = "transparent"}
                >
                  <div style={{ fontFamily: "'JetBrains Mono'", fontSize: 13, color: C.muted }}>{txn.id}</div>
                  <div style={{ fontSize: 13, color: C.white }}>{txn.date}</div>
                  <div style={{ fontSize: 13, color: C.white, fontWeight: 500 }}>{txn.desc}</div>
                  <div style={{ fontFamily: "'JetBrains Mono'", fontSize: 14, color: C.white }}>{txn.amount}</div>
                  <div style={{ fontSize: 13, color: C.muted, display: "flex", alignItems: "center", gap: 6 }}>💳 {txn.method}</div>
                  <div style={{ textAlign: "right" }}>
                    <Tag color={txn.status === "Paid" ? C.accent : C.amber}>{txn.status}</Tag>
                  </div>
                </div>
              ))}
              {filteredTransactions.length === 0 && (
                <div style={{ padding: "60px 24px", textAlign: "center", color: C.muted }}>
                  <div style={{ fontSize: 24, marginBottom: 12 }}>📭</div>
                  <div style={{ fontSize: 14 }}>No transactions found for the selected filter.</div>
                </div>
              )}
            </div>
          )}
        </div>

      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('app-root')).render(<HistoryScreen />);

  </script>
</body>
