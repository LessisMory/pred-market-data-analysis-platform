upstream backend {
  server backend:3000;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Reverse-proxy API traffic to the backend so the browser sees same-origin.
  location /v1/        { proxy_pass http://backend; include /etc/nginx/conf.d/proxy_params.conf; }
  location /api/       { proxy_pass http://backend; include /etc/nginx/conf.d/proxy_params.conf; }
  location /api-docs   { proxy_pass http://backend; include /etc/nginx/conf.d/proxy_params.conf; }
  location /health     { proxy_pass http://backend; include /etc/nginx/conf.d/proxy_params.conf; }

  # WebSocket stream.
  location /stream {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Backward-compatible websocket proxy path.
  location /ws {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Static frontend (plain HTML/JS, no build step).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
